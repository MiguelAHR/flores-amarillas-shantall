# Blueprint de Render: con esto, Render configura todo solo al conectar el repo.
# Documentación: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: flores-amarillas-shantall
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    routes:
      # Todo va a index.html (es una sola página)
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
